name: DualCamLC
options:
  bundleIdPrefix: com.lc
  deploymentTarget:
    iOS: "15.0"
targets:
  DualCamLC:
    type: application
    platform: iOS
    sources:
      - path: DualCamLC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lc.dualcamlc
        INFOPLIST_FILE: DualCamLC/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
